<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Conscientia</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #050505;
      color: #f2f2f2;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    .home {
      width: min(100%, 980px);
    }

    h1 {
      font-size: clamp(3rem, 10vw, 8rem);
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-right: -0.18em;
    }

    .coming-soon {
      margin-top: 25px;
      font-size: 0.8rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      opacity: 0.6;
    }

    .enter {
      margin-top: 45px;
      display: inline-block;
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #f2f2f2;
      padding: 14px 28px;
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .enter:hover,
    .enter:focus-visible {
      border-color: rgba(255, 255, 255, 0.8);
      outline: none;
    }

    .album-map {
      position: relative;
      width: min(430px, 92vw);
      aspect-ratio: 1;
      margin: 46px auto 0;
    }

    .orbit {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .orbit-segment {
      fill: none;
      stroke: rgba(242, 242, 242, 0.07);
      stroke-width: 1;
      stroke-linecap: round;
      transition:
        stroke 0.9s ease,
        filter 0.9s ease;
    }

    .orbit-segment.is-awake {
      stroke: rgba(242, 242, 242, 0.5);
      filter: drop-shadow(0 0 4px rgba(242, 242, 242, 0.12));
    }

    .map-center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 45%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .sigil {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .sigil-piece {
      fill: none;
      stroke: rgba(242, 242, 242, 0.075);
      stroke-width: 1.15;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition:
        stroke 0.9s ease,
        filter 0.9s ease;
    }

    .sigil-piece.is-awake {
      stroke: rgba(242, 242, 242, 0.62);
      filter: drop-shadow(0 0 4px rgba(242, 242, 242, 0.14));
    }

    .sigil-core {
      fill: rgba(242, 242, 242, 0);
      transition: fill 1.2s ease, filter 1.2s ease;
    }

    .sigil.is-complete .sigil-core {
      fill: rgba(242, 242, 242, 0.9);
      filter: drop-shadow(0 0 9px rgba(242, 242, 242, 0.3));
    }

    .map-readout {
      position: absolute;
      left: 50%;
      top: 72%;
      width: 220px;
      max-width: 58%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .chapter-reveal {
      min-height: 1.2em;
      font-size: 0.62rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      opacity: 0.42;
      transition: opacity 0.25s ease;
    }

    .journey-status {
      margin-top: 9px;
      min-height: 1em;
      font-size: 0.54rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.22;
    }

    .chapter-node {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: clamp(42px, 11vw, 52px);
      height: clamp(42px, 11vw, 52px);
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      background: rgba(5, 5, 5, 0.92);

      color: #f2f2f2;
      text-decoration: none;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      opacity: 0.42;

      transition:
        opacity 0.3s ease,
        border-color 0.3s ease,
        transform 0.3s ease,
        background 0.3s ease,
        box-shadow 0.3s ease;
    }

    .chapter-node:hover,
    .chapter-node:focus-visible {
      opacity: 1;
      border-color: rgba(255, 255, 255, 0.78);
      transform: translate(-50%, -50%) scale(1.08);
      background: rgba(255, 255, 255, 0.035);
      outline: none;
    }

    .chapter-node.visited {
      opacity: 0.9;
      border-color: rgba(255, 255, 255, 0.48);
      background: rgba(255, 255, 255, 0.025);
    }

    .chapter-node.visited::after {
      content: "";
      position: absolute;
      width: 3px;
      height: 3px;
      left: 50%;
      bottom: 6px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(242, 242, 242, 0.7);
    }

    .chapter-node[data-chapter="9"].visited {
      border-color: rgba(244, 237, 218, 0.72);
      box-shadow: 0 0 16px rgba(244, 237, 218, 0.07);
    }

    .links {
      margin-top: 42px;
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .links a {
      color: #f2f2f2;
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      opacity: 0.6;
      transition: opacity 0.3s ease;
    }

    .links a:hover,
    .links a:focus-visible {
      opacity: 1;
      outline: none;
    }

    .contact-note {
      margin-top: 18px;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      opacity: 0.35;
      line-height: 1.6;
    }

    #status {
      margin-top: 20px;
      font-size: 0.7rem;
      opacity: 0.4;
    }

    @media (max-width: 520px) {
      .screen {
        padding: 24px 14px 36px;
        align-items: flex-start;
      }

      h1 {
        margin-top: 34px;
      }

      .album-map {
        width: min(360px, 96vw);
        margin-top: 38px;
      }

      .map-center {
        width: 42%;
      }

      .map-readout {
        top: 70%;
        max-width: 52%;
      }

      .chapter-reveal {
        font-size: 0.52rem;
        letter-spacing: 0.18em;
      }

      .journey-status {
        font-size: 0.48rem;
      }

      .links {
        margin-top: 32px;
        gap: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .orbit-segment,
      .sigil-piece,
      .sigil-core,
      .chapter-node {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <audio id="introAudio" preload="auto" loop>
    <source src="./intro.mp3.wav" type="audio/wav">
  </audio>

  <main class="screen">
    <div class="home">

      <h1>Conscientia</h1>

      <p class="coming-soon">
        Coming Soon
      </p>

      <button class="enter" id="enterButton">
        Enter
      </button>

      <div class="album-map" id="albumMap">

        <svg class="orbit" viewBox="0 0 420 420" aria-hidden="true">
          <path class="orbit-segment" data-chapter="1" d="M210 40 L309.9 72.5" />
          <path class="orbit-segment" data-chapter="2" d="M309.9 72.5 L371.7 157.5" />
          <path class="orbit-segment" data-chapter="3" d="M371.7 157.5 L371.7 262.5" />
          <path class="orbit-segment" data-chapter="4" d="M371.7 262.5 L309.9 347.5" />
          <path class="orbit-segment" data-chapter="5" d="M309.9 347.5 L210 380" />
          <path class="orbit-segment" data-chapter="6" d="M210 380 L110.1 347.5" />
          <path class="orbit-segment" data-chapter="7" d="M110.1 347.5 L48.3 262.5" />
          <path class="orbit-segment" data-chapter="8" d="M48.3 262.5 L48.3 157.5" />
          <path class="orbit-segment" data-chapter="9" d="M48.3 157.5 L110.1 72.5" />
          <path class="orbit-segment" data-chapter="10" d="M110.1 72.5 L210 40" />
        </svg>

        <div class="map-center" aria-hidden="true">
          <svg class="sigil" id="journeySigil" viewBox="0 0 200 200">
            <path class="sigil-piece" data-chapter="1" d="M100 24 A76 76 0 0 1 176 100" />
            <path class="sigil-piece" data-chapter="2" d="M176 100 A76 76 0 0 1 100 176" />
            <path class="sigil-piece" data-chapter="3" d="M100 176 A76 76 0 0 1 24 100" />
            <path class="sigil-piece" data-chapter="4" d="M24 100 A76 76 0 0 1 100 24" />
            <path class="sigil-piece" data-chapter="5" d="M100 42 L100 100" />
            <path class="sigil-piece" data-chapter="6" d="M100 100 L100 158" />
            <path class="sigil-piece" data-chapter="7" d="M100 63 L137 100" />
            <path class="sigil-piece" data-chapter="8" d="M137 100 L100 137" />
            <path class="sigil-piece" data-chapter="9" d="M100 137 L63 100" />
            <path class="sigil-piece" data-chapter="10" d="M63 100 L100 63" />
            <circle class="sigil-core" cx="100" cy="100" r="3.2" />
          </svg>
        </div>

        <div class="map-readout" aria-hidden="true">
          <p class="chapter-reveal" id="chapterReveal">The Journey</p>
          <p class="journey-status" id="journeyStatus"></p>
        </div>

        <a class="chapter-node" href="chapter1.html" data-chapter="1" data-title="Nova Visio" style="--x:50%; --y:9.5%;" aria-label="I — Nova Visio">I</a>
        <a class="chapter-node" href="chapter2.html" data-chapter="2" data-title="Ignarus Sui" style="--x:73.8%; --y:17.3%;" aria-label="II — Ignarus Sui">II</a>
        <a class="chapter-node" href="chapter3.html" data-chapter="3" data-title="Inantias" style="--x:88.5%; --y:37.5%;" aria-label="III — Inantias">III</a>
        <a class="chapter-node" href="chapter4.html" data-chapter="4" data-title="Disciplina" style="--x:88.5%; --y:62.5%;" aria-label="IV — Disciplina">IV</a>
        <a class="chapter-node" href="chapter5.html" data-chapter="5" data-title="Relaptus" style="--x:73.8%; --y:82.7%;" aria-label="V — Relaptus">V</a>
        <a class="chapter-node" href="chapter6.html" data-chapter="6" data-title="Umbra" style="--x:50%; --y:90.5%;" aria-label="VI — Umbra">VI</a>
        <a class="chapter-node" href="chapter7.html" data-chapter="7" data-title="Silentium" style="--x:26.2%; --y:82.7%;" aria-label="VII — Silentium">VII</a>
        <a class="chapter-node" href="chapter8.html" data-chapter="8" data-title="Conscientia" style="--x:11.5%; --y:62.5%;" aria-label="VIII — Conscientia">VIII</a>
        <a class="chapter-node" href="chapter9.html" data-chapter="9" data-title="Lux" style="--x:11.5%; --y:37.5%;" aria-label="IX — Lux">IX</a>
        <a class="chapter-node" href="chapter10.html" data-chapter="10" data-title="Iter Aeternum" style="--x:26.2%; --y:17.3%;" aria-label="X — Iter Aeternum">X</a>

      </div>

      <div class="links">

        <a
          href="https://www.instagram.com/conscientiaband/"
          target="_blank"
          rel="noopener noreferrer">
          Instagram
        </a>

        <a href="mailto:contact@conscientiaband.com">
          contact@conscientiaband.com
        </a>

      </div>

      <p class="contact-note">
        For any inquiries, feel free to reach out via Instagram for a faster response.
      </p>

      <p id="status"></p>

    </div>
  </main>

  <script>
    const button = document.getElementById("enterButton");
    const audio = document.getElementById("introAudio");
    const status = document.getElementById("status");

    const sigil = document.getElementById("journeySigil");
    const journeyStatus = document.getElementById("journeyStatus");
    const chapterReveal = document.getElementById("chapterReveal");
    const chapterLinks = document.querySelectorAll(".chapter-node[data-chapter]");
    const orbitSegments = document.querySelectorAll(".orbit-segment[data-chapter]");
    const journeyKey = "conscientia-journey";

    const getJourney = () => {
      try {
        return JSON.parse(localStorage.getItem(journeyKey) || "[]")
          .filter(value => Number.isInteger(value) && value >= 1 && value <= 10);
      } catch (error) {
        return [];
      }
    };

    const renderJourney = () => {
      const visited = getJourney();

      document.querySelectorAll(".sigil-piece").forEach(piece => {
        piece.classList.toggle("is-awake", visited.includes(Number(piece.dataset.chapter)));
      });

      orbitSegments.forEach(segment => {
        segment.classList.toggle("is-awake", visited.includes(Number(segment.dataset.chapter)));
      });

      chapterLinks.forEach(link => {
        link.classList.toggle("visited", visited.includes(Number(link.dataset.chapter)));
      });

      sigil.classList.toggle("is-complete", visited.length === 10);

      if (visited.length === 0) {
        journeyStatus.textContent = "";
      } else if (visited.length < 10) {
        journeyStatus.textContent = `${visited.length} / 10`;
      } else {
        journeyStatus.textContent = "The cycle is complete";
      }
    };

    chapterLinks.forEach(link => {
      const reveal = () => {
        chapterReveal.textContent = `${link.textContent.trim()} — ${link.dataset.title}`;
        chapterReveal.style.opacity = "0.78";
      };

      const conceal = () => {
        chapterReveal.textContent = "The Journey";
        chapterReveal.style.opacity = "0.42";
      };

      link.addEventListener("pointerenter", reveal);
      link.addEventListener("pointerleave", conceal);
      link.addEventListener("focus", reveal);
      link.addEventListener("blur", conceal);

      link.addEventListener("click", () => {
        try {
          const chapter = Number(link.dataset.chapter);
          const visited = getJourney();

          if (!visited.includes(chapter)) {
            visited.push(chapter);
            visited.sort((a, b) => a - b);
            localStorage.setItem(journeyKey, JSON.stringify(visited));
          }
        } catch (error) {
          // Navigation still works if local storage is unavailable.
        }
      });
    });

    renderJourney();
    window.addEventListener("pageshow", renderJourney);

    button.addEventListener("click", async () => {
      try {
        audio.volume = 0;
        await audio.play();

        button.textContent = "Playing";
        status.textContent = "";

        let volume = 0;

        const fadeIn = setInterval(() => {
          volume += 0.02;

          if (volume >= 0.6) {
            audio.volume = 0.6;
            clearInterval(fadeIn);
          } else {
            audio.volume = volume;
          }
        }, 100);

      } catch (error) {
        console.error(error);
        status.textContent = "Audio could not be loaded.";
      }
    });
  </script>

</body>
</html>
