<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Conscientia</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #050505;
      color: #f2f2f2;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    h1 {
      font-size: clamp(3rem, 10vw, 8rem);
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-right: -0.18em;
    }

    .coming-soon {
      margin-top: 25px;
      font-size: 0.8rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      opacity: 0.6;
    }

    .enter {
      margin-top: 45px;
      display: inline-block;
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #f2f2f2;
      padding: 14px 28px;
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .enter:hover {
      border-color: rgba(255, 255, 255, 0.8);
    }

    .sigil-wrap {
      margin: 42px auto 6px;
      width: 190px;
      max-width: 58vw;
      opacity: 0.92;
    }

    .sigil {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .sigil-piece {
      fill: none;
      stroke: rgba(242, 242, 242, 0.075);
      stroke-width: 1.15;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition:
        stroke 0.9s ease,
        filter 0.9s ease;
    }

    .sigil-piece.is-awake {
      stroke: rgba(242, 242, 242, 0.62);
      filter: drop-shadow(0 0 4px rgba(242, 242, 242, 0.14));
    }

    .sigil-core {
      fill: rgba(242, 242, 242, 0);
      transition: fill 1.2s ease, filter 1.2s ease;
    }

    .sigil.is-complete .sigil-core {
      fill: rgba(242, 242, 242, 0.9);
      filter: drop-shadow(0 0 9px rgba(242, 242, 242, 0.3));
    }

    .journey-status {
      margin-top: 13px;
      min-height: 1em;
      font-size: 0.58rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      opacity: 0.28;
    }

    .chapters {
      margin-top: 34px;
      display: grid;
      grid-template-columns: repeat(5, 58px);
      gap: 12px;
      justify-content: center;
    }

    .chapters a {
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255, 255, 255, 0.22);

      color: #f2f2f2;
      text-decoration: none;

      font-size: 0.8rem;
      letter-spacing: 0.05em;

      opacity: 0.5;

      transition:
        opacity 0.3s ease,
        border-color 0.3s ease,
        transform 0.3s ease,
        background 0.3s ease;
    }

    .chapters a {
      position: relative;
    }

    .chapters a.visited {
      opacity: 0.9;
      border-color: rgba(255, 255, 255, 0.48);
      background: rgba(255, 255, 255, 0.025);
    }

    .chapters a.visited::after {
      content: "";
      position: absolute;
      width: 3px;
      height: 3px;
      left: 50%;
      bottom: 6px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(242, 242, 242, 0.68);
    }

    .chapters a:hover {
      opacity: 1;
      border-color: rgba(255, 255, 255, 0.85);
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.03);
    }

    .links {
      margin-top: 60px;
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .links a {
      color: #f2f2f2;
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      opacity: 0.6;
      transition: opacity 0.3s ease;
    }

    .links a:hover {
      .contact-note {
  margin-top: 18px;
  font-size: 0.65rem;
  letter-spacing: 0.08em;
  opacity: 0.35;
  line-height: 1.6;
}
      opacity: 1;
    }

    #status {
      margin-top: 20px;
      font-size: 0.7rem;
      opacity: 0.4;
    }

    @media (max-width: 500px) {
      .chapters {
        grid-template-columns: repeat(5, 48px);
        gap: 8px;
      }

      .chapters a {
        width: 48px;
        height: 48px;
        font-size: 0.72rem;
      }

      .links {
        gap: 18px;
      }
    }
  </style>
</head>

<body>

  <audio id="introAudio" preload="auto" loop>
    <source src="./intro.mp3.wav" type="audio/wav">
  </audio>

  <main class="screen">
    <div>

      <h1>Conscientia</h1>

      <p class="coming-soon">
        Coming Soon
      </p>

      <button class="enter" id="enterButton">
        Enter
      </button>

      <div class="sigil-wrap" aria-hidden="true">
        <svg class="sigil" id="journeySigil" viewBox="0 0 200 200">
          <path class="sigil-piece" data-chapter="1" d="M100 24 A76 76 0 0 1 176 100" />
          <path class="sigil-piece" data-chapter="2" d="M176 100 A76 76 0 0 1 100 176" />
          <path class="sigil-piece" data-chapter="3" d="M100 176 A76 76 0 0 1 24 100" />
          <path class="sigil-piece" data-chapter="4" d="M24 100 A76 76 0 0 1 100 24" />
          <path class="sigil-piece" data-chapter="5" d="M100 42 L100 100" />
          <path class="sigil-piece" data-chapter="6" d="M100 100 L100 158" />
          <path class="sigil-piece" data-chapter="7" d="M100 63 L137 100" />
          <path class="sigil-piece" data-chapter="8" d="M137 100 L100 137" />
          <path class="sigil-piece" data-chapter="9" d="M100 137 L63 100" />
          <path class="sigil-piece" data-chapter="10" d="M63 100 L100 63" />
          <circle class="sigil-core" cx="100" cy="100" r="3.2" />
        </svg>
        <p class="journey-status" id="journeyStatus"></p>
      </div>

      <div class="chapters">
        <a href="chapter1.html" data-chapter="1">I</a>
        <a href="chapter2.html" data-chapter="2">II</a>
        <a href="chapter3.html" data-chapter="3">III</a>
        <a href="chapter4.html" data-chapter="4">IV</a>
        <a href="chapter5.html" data-chapter="5">V</a>

        <a href="chapter6.html" data-chapter="6">VI</a>
        <a href="chapter7.html" data-chapter="7">VII</a>
        <a href="chapter8.html" data-chapter="8">VIII</a>
        <a href="chapter9.html" data-chapter="9">IX</a>
        <a href="chapter10.html" data-chapter="10">X</a>
      </div>

      <div class="links">

        <a
          href="https://www.instagram.com/conscientiaband/"
          target="_blank"
          rel="noopener noreferrer">
          Instagram
        </a>

        <a href="mailto:contact@conscientiaband.com">
          contact@conscientiaband.com

          
        </a>

      </div>

      <p class="contact-note">
  For any inquiries, feel free to reach out via Instagram for a faster response.
</p>

      <p id="status"></p>

    </div>
  </main>

  <script>
    const button = document.getElementById("enterButton");
    const audio = document.getElementById("introAudio");
    const status = document.getElementById("status");
    const sigil = document.getElementById("journeySigil");
    const journeyStatus = document.getElementById("journeyStatus");
    const chapterLinks = document.querySelectorAll(".chapters a[data-chapter]");
    const journeyKey = "conscientia-journey";

    const getJourney = () => {
      try {
        return JSON.parse(localStorage.getItem(journeyKey) || "[]")
          .filter(value => Number.isInteger(value) && value >= 1 && value <= 10);
      } catch (error) {
        return [];
      }
    };

    const renderJourney = () => {
      const visited = getJourney();

      document.querySelectorAll(".sigil-piece").forEach(piece => {
        piece.classList.toggle("is-awake", visited.includes(Number(piece.dataset.chapter)));
      });

      chapterLinks.forEach(link => {
        link.classList.toggle("visited", visited.includes(Number(link.dataset.chapter)));
      });

      sigil.classList.toggle("is-complete", visited.length === 10);

      if (visited.length === 0) {
        journeyStatus.textContent = "";
      } else if (visited.length < 10) {
        journeyStatus.textContent = `${visited.length} / 10`;
      } else {
        journeyStatus.textContent = "The cycle is complete";
      }
    };

    chapterLinks.forEach(link => {
      link.addEventListener("click", () => {
        try {
          const chapter = Number(link.dataset.chapter);
          const visited = getJourney();
          if (!visited.includes(chapter)) {
            visited.push(chapter);
            visited.sort((a, b) => a - b);
            localStorage.setItem(journeyKey, JSON.stringify(visited));
          }
        } catch (error) {
          // Navigation still works if local storage is unavailable.
        }
      });
    });

    renderJourney();
    window.addEventListener("pageshow", renderJourney);

    button.addEventListener("click", async () => {
      try {
        audio.volume = 0;

        await audio.play();

        button.textContent = "Playing";
        status.textContent = "";

        let volume = 0;

        const fadeIn = setInterval(() => {
          volume += 0.02;

          if (volume >= 0.6) {
            audio.volume = 0.6;
            clearInterval(fadeIn);
          } else {
            audio.volume = volume;
          }
        }, 100);

      } catch (error) {
        console.error(error);
        status.textContent = "Audio could not be loaded.";
      }
    });
  </script>

</body>
</html>
